# Render Blueprint: one web service (API + UI + worker in one process) and a Postgres database.
# Render plan names and prices change, so confirm them in the dashboard before you deploy.
services:
  - type: web
    name: research-desk
    runtime: docker
    plan: starter            # "free" spins down after idle time, which pauses runs; use a paid plan
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: research-db
          property: connectionString
      - key: RUN_WORKER
        value: "1"
      - key: API_TOKEN       # generated by Render; read it in the dashboard, it is your sign-in token
        generateValue: true
      - key: GROQ_API_KEY    # you are prompted for this on first deploy
        sync: false
      - key: CORS_ORIGINS    # set to your Vercel URL only if you host the UI there, e.g. https://your-app.vercel.app
        sync: false
      - key: OPENALEX_MAILTO
        sync: false
      - key: CROSSREF_MAILTO
        sync: false

databases:
  - name: research-db
    plan: basic-256mb
